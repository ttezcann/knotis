[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knotis"
version = "0.1.9"
description = "A teaching-focused extension to Zensical, distributed as a Python package with a command-line interface."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
license = "MIT"
authors = [
  { name = "Tolga Tezcan" },
]
dependencies = [
  "zensical==0.0.65",
]

[project.scripts]
knotis = "knotis.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knotis = [
  "assets/*",
  "assets/vendor/*",
  "scaffold/.gitignore",
  "scaffold/.github/workflows/*.yml",
  "scaffold/zensical.toml",
  "scaffold/assets/*",
  "scaffold/docs/*.md",
  "scaffold/docs/**/*.md",
  "scaffold/docs/assets/**",
  "scaffold/docs/javascripts/*",
  "scaffold/overrides/**/*.html",
]
