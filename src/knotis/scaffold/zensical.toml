# Project information
[project]
site_name = "My site name here"
site_url = "http://localhost:8000/"
docs_dir = "docs"
site_dir = "site"

# Repository
repo_url = "https://github.com/example/example"
repo_name = "example"
edit_uri = "edit/main/docs/"

# Site tree
nav = [
  { "Home" = "index.md" },
  { "Section 1" = [
    { "Page 1" = "section-1/page-1.md" },
    { "Page 2" = "section-1/page-2.md" },
    { "Page 3" = "section-1/page-3.md" },
    { "Page 4" = "section-1/page-4.md" },
    { "Page 5" = "section-1/page-5.md" },
  ] },
  { "Section 2" = [
    { "Page 6" = "section-2/page-6.md" },
    { "Page 7" = "section-2/page-7.md" },
    { "Page 8" = "section-2/page-8.md" },
    { "Page 9" = "section-2/page-9.md" },
    { "Page 10" = "section-2/page-10.md" },
  ] },
  { "Explore" = [
    { "Site graph" = "explore/site-graph.md" },
    { "Glossary" = "explore/glossary.md" },
    { "Content tags" = "explore/content-tags.md" },
  ] },
]

# Knotis settings
## Content
[project.extra.knotis.content]
heading_numbering = true
heading_guides = true
generator = true
styled_section_groups = true

## Wikilinks
[project.extra.knotis.wikilinks]
default = "#0197a7"
slate = "#fda4af"

## Pane
[project.extra.knotis.pane]
width = 750
initial_lines = 12
initial_list_items = 20
chunk_lines = 4
order = []

### Pane path
[project.extra.knotis.pane.path]
enabled = true
include_paths = []
exclude_paths = []

## Graphs
### Site graph
[project.extra.knotis.site_graph.graph]
enabled = true
default_view = "all"
exclude_tags = []
exclude_paths = []
exclude_wikilinks = []

### Page graph
[project.extra.knotis.page_graph.graph]
enabled = true
exclude_paths = []
exclude_wikilinks = []

### Concept graph
[project.extra.knotis.concept_graph.graph]
enabled = true
exclude_paths = []
exclude_wikilinks = []

## Content tags
[project.extra.knotis.content_tags]
enabled = true
nav_chips = true

## Glossary
[project.extra.knotis.glossary]
enabled = true
default_view = "by_page"
page_view_label = "Pages"
exclude_paths = []
order = []

## Slide mode
[project.extra.knotis.slides]
enabled = true
include_paths = []
exclude_paths = []
fit_min_font_px = 26
fit_max_font_px = 42
content_fill = 0.99
content_inset = [2, 2, 2, 2]

## Search
[project.extra.knotis.search]
enabled = true
exclude_paths = []
exclude_wikilinks = []
order = []

## Read Aloud
[project.extra.knotis.readaloud]
enabled = true

# Zensical settings
## Theme settings
[project.theme]
custom_dir = "overrides"
variant = "modern"
font = false
primary = "indigo"
accent = "indigo"
features = [
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.top",
  "navigation.expand",
  "toc.follow",
  "content.code.copy",
  "content.code.annotate",
  "content.tooltips",
  "content.tabs.link",
  "content.action.view",
]

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

# Markdown extensions
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.sane_lists]
[project.markdown_extensions.tables]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.abbr]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.critic]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
